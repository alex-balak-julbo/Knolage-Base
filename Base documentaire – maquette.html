<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base documentaire</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--side:#efeee9;--text:#1f2328;--mute:#6b7280;--line:#dcdad3;--acc:#2f6f5e;--accbg:#dcece6;--danger:#b4372c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--panel:#1f2124;--side:#1b1c1e;--text:#e7e7e4;--mute:#9a9ea5;--line:#33363a;--acc:#6fc1a8;--accbg:#27403a;--danger:#e57d72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--panel:#1f2124;--side:#1b1c1e;--text:#e7e7e4;--mute:#9a9ea5;--line:#33363a;--acc:#6fc1a8;--accbg:#27403a;--danger:#e57d72;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;height:100%}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:14px 14px 8px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.search{padding:0 12px 10px;display:grid;gap:6px}
input,select,button,textarea{font:inherit;color:var(--text)}
.search input,.search select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.tree{flex:1;overflow:auto;padding:0 8px 12px}
.row{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:7px;cursor:pointer}
.row:hover{background:var(--accbg)}
.row.sel{background:var(--accbg);font-weight:600}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .acts{display:none;gap:2px}
.row:hover .acts,.row.sel .acts{display:flex}
.ib{border:0;background:transparent;cursor:pointer;padding:2px 5px;border-radius:5px;color:var(--mute);font-size:13px}
.ib:hover{background:var(--line);color:var(--text)}
.ib.del:hover{color:var(--danger)}
.lvl1{padding-left:14px}.lvl2{padding-left:28px}
.folder{font-weight:600;margin-top:4px}.section{color:var(--text)}
.tw{width:14px;color:var(--mute);font-size:11px}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#10201b}}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.crumb{padding:12px 24px 0;color:var(--mute);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 24px;border-bottom:1px solid var(--line)}
.bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.tb{border:1px solid transparent;background:transparent;padding:4px 9px;border-radius:7px;cursor:pointer;min-width:30px}
.tb:hover{background:var(--accbg)}
.scroll{flex:1;overflow:auto;padding:16px 24px 40px}
.page{max-width:820px;margin:0 auto}
#title{width:100%;border:0;background:transparent;font-size:28px;font-weight:700;padding:4px 0;outline:none}
#ed{min-height:55vh;outline:none;padding:6px 0}
#ed img{max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line);margin:6px 0}
#ed h1{font-size:24px;margin:18px 0 6px}#ed h2{font-size:20px;margin:16px 0 6px}#ed h3{font-size:17px;margin:14px 0 4px}
#ed code{background:var(--accbg);padding:1px 5px;border-radius:4px}
#ed blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--acc);color:var(--mute)}
.empty{color:var(--mute);text-align:center;margin-top:20vh}
.res{padding:8px;border-radius:8px;cursor:pointer;margin-bottom:2px}.res:hover{background:var(--accbg)}
.res small{display:block;color:var(--mute)}
.res mark{background:#ffe08a;color:#000;border-radius:3px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(640px,100%);max-height:90%;display:flex;flex-direction:column;gap:10px}
.dlg h3{margin:0}.dlg input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.dlg textarea{flex:1;min-height:260px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:13px/1.45 ui-monospace,Menlo,monospace}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:6px}.tabs .btn.on{background:var(--accbg);border-color:var(--acc)}
.hint{color:var(--mute);font-size:12px}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:42% 58%}aside{border-right:0;border-bottom:1px solid var(--line)}.bar,.scroll,.crumb{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><span>📚 Base documentaire</span><button class="btn pri" id="addF">+ Dossier</button></div>
  <div class="search">
    <input id="q" type="search" placeholder="Rechercher…">
    <select id="scope"><option value="all">Titre + contenu</option><option value="title">Titre de la note</option><option value="content">Contenu uniquement</option></select>
  </div>
  <div class="tree" id="tree"></div>
</aside>
<main id="main">
  <div class="crumb" id="crumb"></div>
  <div class="bar" id="bar">
    <button class="tb" data-b="h1" title="Titre 1"><b>H1</b></button>
    <button class="tb" data-b="h2" title="Titre 2"><b>H2</b></button>
    <button class="tb" data-b="h3" title="Titre 3"><b>H3</b></button>
    <button class="tb" data-b="p" title="Paragraphe">¶</button>
    <span class="sep"></span>
    <button class="tb" data-c="bold" title="Gras"><b>G</b></button>
    <button class="tb" data-c="italic" title="Italique"><i>I</i></button>
    <button class="tb" data-c="insertUnorderedList" title="Liste à puces">• Liste</button>
    <button class="tb" data-c="insertOrderedList" title="Liste numérotée">1. Liste</button>
    <button class="tb" data-b="blockquote" title="Citation">❝</button>
    <button class="tb" id="lnk" title="Lien">🔗</button>
    <span class="sep"></span>
    <button class="btn" id="expN">⤓ Exporter la note</button>
    <button class="btn" id="delN">Supprimer</button>
  </div>
  <div class="scroll"><div class="page" id="page">
    <input id="title" placeholder="Titre de la note">
    <div id="ed" contenteditable="true" data-ph="Écrivez ici… Vous pouvez coller des images (Ctrl+V)."></div>
  </div><div class="empty" id="empty" style="display:none">Sélectionnez ou créez une note.<br><span class="hint">Dossier → Sélection → Note</span></div></div>
</main>
</div>

<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>

<script>
(function(){
var KEY='docbase-v1',uid=function(){return Math.random().toString(36).slice(2,9)};
var S=load(),cur=null,open={};
function seed(){return{folders:[{id:uid(),name:'Informatique',sections:[
 {id:uid(),name:'Sauvegardes',notes:[{id:uid(),title:'Procédure de sauvegarde hebdomadaire',html:'<h2>Objectif</h2><p>Vérifier que la sauvegarde du vendredi s’est bien déroulée.</p><h2>Étapes</h2><ol><li>Ouvrir la console de sauvegarde</li><li>Contrôler le statut <b>Terminé</b></li><li>Noter le résultat dans le registre</li></ol><h3>Points d’attention</h3><ul><li>Espace disque supérieur à 20 %</li><li>Aucune alerte rouge</li></ul>'}]},
 {id:uid(),name:'Comptes utilisateurs',notes:[{id:uid(),title:'Création d’un compte',html:'<p>Coller ici une capture d’écran du formulaire.</p><ul><li>Nom et prénom</li><li>Service</li></ul>'}]}]},
 {id:uid(),name:'Ressources humaines',sections:[{id:uid(),name:'Arrivées',notes:[{id:uid(),title:'Accueil d’un nouvel arrivant',html:'<h2>Avant l’arrivée</h2><ul><li>Préparer le poste</li><li>Prévenir l’équipe</li></ul>'}]}]}]}}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
var tm;function save(){clearTimeout(tm);tm=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},300)}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function txt(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent||''}
function find(id){for(var f of S.folders){for(var s of f.sections){for(var n of s.notes)if(n.id===id)return{f:f,s:s,n:n}}}return null}

/* ---------- tree ---------- */
function acts(kind,id,extra){return '<span class="acts">'+(extra||'')+'<button class="ib" data-a="ren" data-k="'+kind+'" data-i="'+id+'" title="Renommer">✎</button><button class="ib" data-a="exp" data-k="'+kind+'" data-i="'+id+'" title="Exporter">⤓</button><button class="ib del" data-a="del" data-k="'+kind+'" data-i="'+id+'" title="Supprimer">✕</button></span>'}
function renderTree(){
 var h='';
 S.folders.forEach(function(f){
  var o=open[f.id]!==false;
  h+='<div class="row folder" data-a="tog" data-i="'+f.id+'"><span class="tw">'+(o?'▾':'▸')+'</span>📁<span class="name">'+esc(f.name)+'</span>'+acts('f',f.id,'<button class="ib" data-a="addS" data-i="'+f.id+'" title="Nouvelle sélection">+</button>')+'</div>';
  if(!o)return;
  f.sections.forEach(function(s){
   var so=open[s.id]!==false;
   h+='<div class="row section lvl1" data-a="tog" data-i="'+s.id+'"><span class="tw">'+(so?'▾':'▸')+'</span>🗂️<span class="name">'+esc(s.name)+'</span>'+acts('s',s.id,'<button class="ib" data-a="addN" data-i="'+s.id+'" title="Nouvelle note">+</button>')+'</div>';
   if(!so)return;
   s.notes.forEach(function(n){h+='<div class="row lvl2'+(n.id===cur?' sel':'')+'" data-a="note" data-i="'+n.id+'"><span class="tw"></span>📄<span class="name">'+esc(n.title||'Sans titre')+'</span>'+acts('n',n.id)+'</div>'});
  });
 });
 if(!S.folders.length)h='<p class="hint" style="padding:10px">Aucun dossier. Cliquez sur « + Dossier ».</p>';
 $('tree').innerHTML=h;
}

/* ---------- search ---------- */
function hl(t,q){var i=t.toLowerCase().indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))}
function renderSearch(){
 var q=$('q').value.trim().toLowerCase();if(!q){renderTree();return}
 var sc=$('scope').value,h='',c=0;
 S.folders.forEach(function(f){f.sections.forEach(function(s){s.notes.forEach(function(n){
  var t=(n.title||'').toLowerCase(),b=txt(n.html),bl=b.toLowerCase();
  var ok=sc==='title'?t.indexOf(q)>=0:sc==='content'?bl.indexOf(q)>=0:(t.indexOf(q)>=0||bl.indexOf(q)>=0);
  if(!ok)return;c++;
  var sn='';var i=bl.indexOf(q);if(i>=0&&sc!=='title'){var a=Math.max(0,i-30);sn='…'+hl(b.slice(a,i+q.length+50),q)+'…'}
  h+='<div class="res" data-a="note" data-i="'+n.id+'">📄 '+hl(n.title||'Sans titre',q)+'<small>'+esc(f.name)+' › '+esc(s.name)+'</small>'+(sn?'<small>'+sn+'</small>':'')+'</div>';
 })})});
 $('tree').innerHTML='<p class="hint" style="padding:4px 8px">'+c+' résultat'+(c>1?'s':'')+'</p>'+(h||'');
}
$('q').addEventListener('input',renderSearch);$('scope').addEventListener('change',renderSearch);

/* ---------- editor ---------- */
function showNote(){
 var r=cur&&find(cur);var has=!!r;
 $('page').style.display=has?'':'none';$('empty').style.display=has?'none':'';$('bar').style.visibility=has?'visible':'hidden';
 $('crumb').textContent=has?r.f.name+' › '+r.s.name:'';
 if(has){$('title').value=r.n.title;$('ed').innerHTML=r.n.html}
}
$('title').addEventListener('input',function(){var r=find(cur);if(!r)return;r.n.title=this.value;save();var el=document.querySelector('.row.sel .name');if(el)el.textContent=this.value||'Sans titre'});
$('ed').addEventListener('input',function(){var r=find(cur);if(!r)return;r.n.html=this.innerHTML;save()});
$('ed').addEventListener('paste',function(e){
 var items=(e.clipboardData||{}).items||[];
 for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image/')===0){
  e.preventDefault();var fr=new FileReader();
  fr.onload=function(){document.execCommand('insertImage',false,fr.result);$('ed').dispatchEvent(new Event('input'))};
  fr.readAsDataURL(items[i].getAsFile());return}}
});
$('bar').addEventListener('mousedown',function(e){if(e.target.closest('.tb'))e.preventDefault()});
$('bar').addEventListener('click',function(e){
 var b=e.target.closest('.tb');if(!b)return;$('ed').focus();
 if(b.dataset.b)document.execCommand('formatBlock',false,b.dataset.b);
 else if(b.dataset.c)document.execCommand(b.dataset.c);
 $('ed').dispatchEvent(new Event('input'));
});
$('lnk').addEventListener('click',function(){
 var sel=window.getSelection(),rg=sel.rangeCount?sel.getRangeAt(0).cloneRange():null;
 ask('Adresse du lien','https://').then(function(u){if(!u)return;$('ed').focus();if(rg){sel.removeAllRanges();sel.addRange(rg)}document.execCommand('createLink',false,u);$('ed').dispatchEvent(new Event('input'))});
});

/* ---------- dialogs ---------- */
function closeD(){$('ov').classList.remove('on');$('dlg').innerHTML=''}
function ask(title,val){return new Promise(function(res){
 $('dlg').innerHTML='<h3>'+esc(title)+'</h3><input type="text" id="dv"><div class="acts"><button class="btn" id="dc">Annuler</button><button class="btn pri" id="dk">OK</button></div>';
 $('ov').classList.add('on');var i=$('dv');i.value=val||'';i.focus();i.select();
 function ok(){var v=i.value.trim();closeD();res(v)}
 $('dk').onclick=ok;$('dc').onclick=function(){closeD();res(null)};
 i.onkeydown=function(e){if(e.key==='Enter')ok();if(e.key==='Escape'){closeD();res(null)}};
})}
function confirmD(msg){return new Promise(function(res){
 $('dlg').innerHTML='<h3>Confirmation</h3><p>'+esc(msg)+'</p><div class="acts"><button class="btn" id="dc">Annuler</button><button class="btn pri" id="dk">Supprimer</button></div>';
 $('ov').classList.add('on');$('dk').onclick=function(){closeD();res(true)};$('dc').onclick=function(){closeD();res(false)};
})}

/* ---------- conversion / export ---------- */
function conv(node,fmt){
 var o='';node.childNodes.forEach(function(n){o+=cn(n,fmt)});return o}
function cn(n,fmt){
 if(n.nodeType===3)return n.nodeValue;
 if(n.nodeType!==1)return'';
 var t=n.tagName.toLowerCase(),md=fmt==='md',k;
 var inner=function(){return conv(n,fmt)};
 if(/^h[1-6]$/.test(t)){k=+t[1];return '\n'+(md?'#'.repeat(k)+' ':'')+inner().trim()+'\n\n'}
 if(t==='p'||t==='div')return inner().trim()?inner().replace(/^\n+|\n+$/g,'')+'\n\n':'\n';
 if(t==='br')return'\n';
 if(t==='b'||t==='strong')return md?'**'+inner()+'**':inner();
 if(t==='i'||t==='em')return md?'*'+inner()+'*':inner();
 if(t==='code')return md?'`'+inner()+'`':inner();
 if(t==='a')return md?'['+inner()+']('+n.getAttribute('href')+')':inner()+' ('+n.getAttribute('href')+')';
 if(t==='img')return md?'![image]('+n.getAttribute('src')+')':'[image]';
 if(t==='blockquote')return inner().trim().split('\n').map(function(l){return '> '+l}).join('\n')+'\n\n';
 if(t==='ul'||t==='ol'){var i=0,s='';n.childNodes.forEach(function(li){if(li.tagName==='LI'){i++;s+=(t==='ul'?'- ':i+'. ')+conv(li,fmt).trim().replace(/\n+/g,'\n   ')+'\n'}});return s+'\n'}
 return inner();
}
function noteOut(n,fmt,lvl){
 if(fmt==='html')return '<h'+lvl+'>'+esc(n.title||'Sans titre')+'</h'+lvl+'>\n'+n.html+'\n';
 var d=document.createElement('div');d.innerHTML=n.html;
 var body=conv(d,fmt).replace(/\n{3,}/g,'\n\n').trim();
 var ttl=n.title||'Sans titre';
 return (fmt==='md'?'#'.repeat(lvl)+' '+ttl:ttl.toUpperCase()+'\n'+'='.repeat(ttl.length))+'\n\n'+body+'\n';
}
function head(fmt,name,lvl){return fmt==='html'?'<h'+lvl+'>'+esc(name)+'</h'+lvl+'>\n':fmt==='md'?'#'.repeat(lvl)+' '+name+'\n\n':name.toUpperCase()+'\n'+'-'.repeat(name.length)+'\n\n'}
function build(kind,id,fmt){
 var o='';
 if(kind==='n'){var r=find(id);o=noteOut(r.n,fmt,1)}
 else if(kind==='s'){var sec;S.folders.forEach(function(f){f.sections.forEach(function(s){if(s.id===id)sec=s})});
  o=head(fmt,sec.name,1)+sec.notes.map(function(n){return noteOut(n,fmt,2)}).join('\n')}
 else{var fo=S.folders.filter(function(f){return f.id===id})[0];
  o=head(fmt,fo.name,1)+fo.sections.map(function(s){return head(fmt,s.name,2)+s.notes.map(function(n){return noteOut(n,fmt,3)}).join('\n')}).join('\n')}
 if(fmt==='html')o='<!DOCTYPE html>\n<html lang="fr"><head><meta charset="utf-8"><title>Export</title></head>\n<body>\n'+o+'</body></html>';
 return o;
}
function exportD(kind,id){
 var fmt='md',lbl={n:'la note',s:'la sélection',f:'le dossier'}[kind];
 $('dlg').innerHTML='<h3>Exporter '+lbl+'</h3><div class="tabs"><button class="btn on" data-f="md">Markdown</button><button class="btn" data-f="html">HTML</button><button class="btn" data-f="txt">Texte</button></div><textarea id="out" readonly></textarea><div class="hint">Copiez le résultat puis collez-le dans un fichier (.md, .html ou .txt). Le téléchargement direct sera disponible dans la version finale.</div><div class="acts"><button class="btn" id="dc">Fermer</button><button class="btn pri" id="cp">Copier</button></div>';
 $('ov').classList.add('on');
 function fill(){$('out').value=build(kind,id,fmt)}fill();
 $('dlg').querySelector('.tabs').onclick=function(e){var b=e.target.closest('[data-f]');if(!b)return;fmt=b.dataset.f;this.querySelectorAll('.btn').forEach(function(x){x.classList.toggle('on',x===b)});fill()};
 $('dc').onclick=closeD;
 $('cp').onclick=function(){var t=$('out');t.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}$('cp').textContent=ok?'Copié ✓':'Sélectionné (Ctrl+C)'};
}
$('ov').addEventListener('mousedown',function(e){if(e.target===this)closeD()});

/* ---------- actions ---------- */
function newNote(sec){var n={id:uid(),title:'Nouvelle note',html:'<p><br></p>'};sec.notes.push(n);cur=n.id;open[sec.id]=true;save();renderTree();showNote();$('title').focus();$('title').select()}
$('addF').onclick=function(){ask('Nom du nouveau dossier','').then(function(v){if(!v)return;S.folders.push({id:uid(),name:v,sections:[]});save();renderTree()})};
$('expN').onclick=function(){if(cur)exportD('n',cur)};
$('delN').onclick=function(){if(cur)act('del','n',cur)};
function act(a,k,id){
 if(a==='ren'){var cu=k==='n'?find(id).n.title:k==='s'?findS(id).name:S.folders.filter(function(f){return f.id===id})[0].name;
  ask('Nouveau nom',cu).then(function(v){if(!v)return;if(k==='n')find(id).n.title=v;else if(k==='s')findS(id).name=v;else S.folders.filter(function(f){return f.id===id})[0].name=v;save();renderTree();showNote()})}
 else if(a==='exp')exportD(k,id);
 else if(a==='del'){confirmD('Supprimer cet élément et tout ce qu’il contient ?').then(function(y){if(!y)return;
  if(k==='n'){S.folders.forEach(function(f){f.sections.forEach(function(s){s.notes=s.notes.filter(function(n){return n.id!==id})})})}
  else if(k==='s'){S.folders.forEach(function(f){f.sections=f.sections.filter(function(s){return s.id!==id})})}
  else S.folders=S.folders.filter(function(f){return f.id!==id});
  if(!find(cur))cur=null;save();renderTree();showNote()})}
}
function findS(id){var r;S.folders.forEach(function(f){f.sections.forEach(function(s){if(s.id===id)r=s})});return r}
$('tree').addEventListener('click',function(e){
 var ib=e.target.closest('.ib');
 if(ib){e.stopPropagation();var a=ib.dataset.a;
  if(a==='addS'){var f=S.folders.filter(function(x){return x.id===ib.dataset.i})[0];ask('Nom de la nouvelle sélection','').then(function(v){if(!v)return;f.sections.push({id:uid(),name:v,notes:[]});open[f.id]=true;save();renderTree()})}
  else if(a==='addN')newNote(findS(ib.dataset.i));
  else act(a,ib.dataset.k,ib.dataset.i);return}
 var r=e.target.closest('[data-a]');if(!r)return;
 if(r.dataset.a==='tog'){open[r.dataset.i]=open[r.dataset.i]===false;renderTree()}
 else if(r.dataset.a==='note'){cur=r.dataset.i;if($('q').value.trim())renderSearch();else renderTree();showNote()}
});

/* init */
