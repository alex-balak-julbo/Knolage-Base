<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base documentaire</title>
<style>
:root{--bg:#fbfaf8;--panel:#fff;--side:#f1f0ec;--text:#1f2328;--mute:#8a8f98;--line:#e1dfd8;--acc:#2f6f5e;--accbg:#e1efe9;--danger:#b4372c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--panel:#1f2124;--side:#1b1c1e;--text:#e7e7e4;--mute:#8d9198;--line:#33363a;--acc:#6fc1a8;--accbg:#27403a;--danger:#e57d72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--panel:#1f2124;--side:#1b1c1e;--text:#e7e7e4;--mute:#8d9198;--line:#33363a;--acc:#6fc1a8;--accbg:#27403a;--danger:#e57d72;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;height:100%}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:14px 14px 8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.search{padding:0 12px 10px;display:grid;gap:6px}
input,select,button,textarea{font:inherit;color:var(--text)}
.search input,.search select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.tree{flex:1;overflow:auto;padding:0 8px 12px}
.row{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:7px;cursor:pointer}
.row:hover{background:var(--accbg)}.row.sel{background:var(--accbg);font-weight:600}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .acts{display:none}.row:hover .acts,.row.sel .acts{display:flex}
.ib{border:0;background:transparent;cursor:pointer;padding:2px 5px;border-radius:5px;color:var(--mute);font-size:13px}
.ib:hover{background:var(--line);color:var(--text)}.ib.del:hover{color:var(--danger)}
.folder{font-weight:600;margin-top:4px}
.tw{width:14px;color:var(--mute);font-size:11px}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#10201b}}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:8px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--line)}
.crumb{flex:1;color:var(--mute);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb a{cursor:pointer;color:var(--acc)}
.scroll{flex:1;overflow:auto;padding:24px 24px 80px}
.page{max-width:780px;margin:0 auto}
.badge{display:inline-block;font-size:12px;color:var(--acc);background:var(--accbg);padding:1px 9px;border-radius:99px}
#title{width:100%;border:0;background:transparent;font-size:34px;font-weight:700;padding:4px 0;outline:none}
.props{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 14px;padding:6px 0}
.pr{display:grid;grid-template-columns:190px 1fr;gap:8px;align-items:center;padding:2px 0}
.pr label{color:var(--mute);font-size:13px}
.pr input,.pr select{border:0;background:transparent;padding:4px 6px;border-radius:6px;outline:none}
.pr input:hover,.pr select:hover,.pr input:focus{background:var(--accbg)}
.blk{display:flex;align-items:flex-start;gap:2px;position:relative;padding:1px 0}
.gut{display:flex;width:46px;flex:none;opacity:0;justify-content:flex-end}
.blk:hover .gut,.blk:focus-within .gut{opacity:1}
.mk{width:22px;flex:none;text-align:center;color:var(--mute);padding-top:1px}
.blk[data-t=text] .mk,.blk[data-t=h1] .mk,.blk[data-t=h2] .mk{display:none}
.ce{flex:1;min-width:0;outline:none;min-height:1.55em;padding:1px 2px;word-break:break-word}
.ce:empty:focus::before{content:attr(data-ph);color:var(--mute)}
.blk[data-t=h1] .ce{font-size:26px;font-weight:700;margin-top:14px;line-height:1.3}
.blk[data-t=h2] .ce{font-size:20px;font-weight:700;margin-top:10px;line-height:1.35}
.ce img{max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line);margin:6px 0;display:block}
.pg{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;margin:3px 0}
.pg:hover{border-color:var(--acc)}
.add{margin:14px 0 0 48px;color:var(--mute);cursor:pointer;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:5px 12px}
.add:hover{color:var(--text);border-color:var(--acc)}
.empty{color:var(--mute);text-align:center;margin-top:20vh}
.res{padding:8px;border-radius:8px;cursor:pointer;margin-bottom:2px}.res:hover{background:var(--accbg)}
.res small{display:block;color:var(--mute)}
.res mark{background:#ffe08a;color:#000;border-radius:3px}
#menu{position:fixed;display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:60;min-width:210px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer}
#menu button:hover{background:var(--accbg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(640px,100%);max-height:90%;display:flex;flex-direction:column;gap:10px;overflow:auto}
.dlg h3{margin:0}.dlg input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.dlg textarea{flex:1;min-height:260px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:13px/1.45 ui-monospace,Menlo,monospace}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:6px}.tabs .btn.on{background:var(--accbg);border-color:var(--acc)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.tpl:hover{border-color:var(--acc)}.tpl small{display:block;color:var(--mute)}
.hint{color:var(--mute);font-size:12px}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:38% 62%}aside{border-right:0;border-bottom:1px solid var(--line)}.top,.scroll{padding-left:14px;padding-right:14px}.pr{grid-template-columns:1fr}.gut{width:36px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><span>📚 Base documentaire</span><button class="btn pri" id="addF">+ Dossier</button></div>
  <div class="search">
    <input id="q" type="search" placeholder="Rechercher…">
    <select id="scope"><option value="all">Titre + contenu</option><option value="title">Titre de la note</option><option value="content">Contenu uniquement</option></select>
  </div>
  <div class="tree" id="tree"></div>
</aside>
<main>
  <div class="top"><div class="crumb" id="crumb"></div>
    <button class="btn" id="expN">⤓ Exporter</button><button class="btn" id="delN">Supprimer</button></div>
  <div class="scroll"><div class="page" id="page">
    <span class="badge" id="badge"></span>
    <input id="title" placeholder="Sans titre">
    <div class="props" id="props"></div>
    <div id="blocks"></div>
    <button class="add" id="addB">+ Ajouter un bloc</button>
    <p class="hint" style="margin:14px 0 0 48px">Astuces : tapez « / » pour insérer un bloc, « # » ou « ## » pour un titre, « - » pour une liste, Ctrl+V pour coller une image, Ctrl+B / Ctrl+I pour le gras et l’italique.</p>
  </div><div class="empty" id="empty" style="display:none">Sélectionnez ou créez une note.<br><span class="hint">Dossier → Sélection → Note</span></div></div>
</main>
</div>
<div id="menu"></div>
<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>

<script>
(function(){
var KEY='docbase-v2',uid=function(){return Math.random().toString(36).slice(2,9)};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function txt(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent||''}

/* ---------- modèles ---------- */
var TPL={
 vide:{name:'Note vierge',icon:'📄',desc:'Page libre',props:[],blocks:[['text','']]},
 proc:{name:'Procédure',icon:'🛠️',desc:'Application, but, prérequis, étapes',props:[{k:'app',l:'Application / Spécialité'},{k:'but',l:'But'},{k:'statut',l:'Statut',opts:['Brouillon','À valider','Validée']}],blocks:[['h2','Prérequis'],['ul',''],['h2','Étapes'],['ol',''],['h2','Remarques'],['text','']]}
};
var TYPES=[['text','Texte','¶'],['h1','Titre 1','H1'],['h2','Titre 2','H2'],['ul','Liste à puces','•'],['ol','Liste numérotée','1.'],['page','Page','📄']];
function mk(tpl,title,parent,props,blocks){return{id:uid(),title:title,tpl:tpl,parent:parent||null,props:props||{},blocks:(blocks||TPL[tpl].blocks).map(function(x){return{id:uid(),t:x[0],html:x[1]||'',ref:x[2]}})}}
function seed(){
 var ch=mk('vide','Que faire en cas d’échec ?',null,{},[['text','Relancer la tâche manuellement, puis prévenir le responsable infrastructure.']]);
 var p=mk('proc','Sauvegarde hebdomadaire',null,{app:'Veeam Backup',but:'Vérifier que la sauvegarde du vendredi s’est bien déroulée.',statut:'Validée'},[['h2','Prérequis'],['ul','Accès à la console de sauvegarde'],['ul','Droits administrateur'],['h2','Étapes'],['ol','Ouvrir la console'],['ol','Contrôler le statut <b>Terminé</b>'],['ol','Noter le résultat dans le registre'],['page','',ch.id],['text','Collez une capture d’écran ici avec Ctrl+V.']]);
 ch.parent=p.id;
 var c=mk('proc','Création d’un compte',null,{app:'Active Directory',but:'Créer le compte d’un nouvel utilisateur.',statut:'À valider'});
 var r=mk('vide','Accueil d’un nouvel arrivant',null,{},[['h2','Avant l’arrivée'],['ul','Préparer le poste'],['ul','Prévenir l’équipe']]);
 return{folders:[{id:uid(),name:'Informatique',sections:[{id:uid(),name:'Sauvegardes',notes:[p,ch]},{id:uid(),name:'Comptes utilisateurs',notes:[c]}]},{id:uid(),name:'Ressources humaines',sections:[{id:uid(),name:'Arrivées',notes:[r]}]}]}
}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
var S=load(),cur=null,open={},tm;
function save(){clearTimeout(tm);tm=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},300)}
function find(id){for(var f of S.folders)for(var s of f.sections)for(var n of s.notes)if(n.id===id)return{f:f,s:s,n:n};return null}
function findS(id){var r;S.folders.forEach(function(f){f.sections.forEach(function(s){if(s.id===id)r=s})});return r}
function findF(id){return S.folders.filter(function(f){return f.id===id})[0]}
function noteText(n){var t=n.title+' ';Object.keys(n.props||{}).forEach(function(k){t+=n.props[k]+' '});n.blocks.forEach(function(b){t+=txt(b.html)+' '});return t}

/* ---------- arbre ---------- */
function acts(k,id,x){return '<span class="acts">'+(x||'')+'<button class="ib" data-a="ren" data-k="'+k+'" data-i="'+id+'" title="Renommer">✎</button><button class="ib" data-a="exp" data-k="'+k+'" data-i="'+id+'" title="Exporter">⤓</button><button class="ib del" data-a="del" data-k="'+k+'" data-i="'+id+'" title="Supprimer">✕</button></span>'}
function noteRows(s,pid,d){var h='';s.notes.filter(function(n){return(n.parent||null)===pid}).forEach(function(n){
 h+='<div class="row'+(n.id===cur?' sel':'')+'" style="padding-left:'+(30+d*14)+'px" data-a="note" data-i="'+n.id+'">📄<span class="name">'+esc(n.title||'Sans titre')+'</span>'+acts('n',n.id)+'</div>'+noteRows(s,n.id,d+1)});return h}
function renderTree(){
 var h='';
 S.folders.forEach(function(f){
  var o=open[f.id]!==false;
  h+='<div class="row folder" data-a="tog" data-i="'+f.id+'"><span class="tw">'+(o?'▾':'▸')+'</span>📁<span class="name">'+esc(f.name)+'</span>'+acts('f',f.id,'<button class="ib" data-a="addS" data-i="'+f.id+'" title="Nouvelle sélection">+</button>')+'</div>';
  if(!o)return;
  f.sections.forEach(function(s){
   var so=open[s.id]!==false;
   h+='<div class="row" style="padding-left:16px" data-a="tog" data-i="'+s.id+'"><span class="tw">'+(so?'▾':'▸')+'</span>🗂️<span class="name">'+esc(s.name)+'</span>'+acts('s',s.id,'<button class="ib" data-a="addN" data-i="'+s.id+'" title="Nouvelle note">+</button>')+'</div>';
   if(so)h+=noteRows(s,null,0);
  });
 });
 if(!S.folders.length)h='<p class="hint" style="padding:10px">Aucun dossier. Cliquez sur « + Dossier ».</p>';
 $('tree').innerHTML=h;
}
function hl(t,q){var i=t.toLowerCase().indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))}
function renderSearch(){
 var q=$('q').value.trim().toLowerCase();if(!q){renderTree();return}
 var sc=$('scope').value,h='',c=0;
 S.folders.forEach(function(f){f.sections.forEach(function(s){s.notes.forEach(function(n){
  var t=(n.title||'').toLowerCase(),b=noteText(n).slice((n.title||'').length+1),bl=b.toLowerCase();
  var ok=sc==='title'?t.indexOf(q)>=0:sc==='content'?bl.indexOf(q)>=0:(t.indexOf(q)>=0||bl.indexOf(q)>=0);
  if(!ok)return;c++;
  var sn='',i=bl.indexOf(q);if(i>=0&&sc!=='title'){var a=Math.max(0,i-30);sn='…'+hl(b.slice(a,i+q.length+50),q)+'…'}
  h+='<div class="res" data-a="note" data-i="'+n.id+'">'+TPL[n.tpl].icon+' '+hl(n.title||'Sans titre',q)+'<small>'+esc(f.name)+' › '+esc(s.name)+'</small>'+(sn?'<small>'+sn+'</small>':'')+'</div>';
 })})});
 $('tree').innerHTML='<p class="hint" style="padding:4px 8px">'+c+' résultat'+(c>1?'s':'')+'</p>'+h;
}
$('q').addEventListener('input',renderSearch);$('scope').addEventListener('change',renderSearch);

/* ---------- page + blocs ---------- */
var GUT='<div class="gut"><button class="ib" data-g="add" title="Ajouter un bloc">+</button><button class="ib" data-g="mn" title="Options">⋮⋮</button></div>';
var PH={text:'Tapez « / » pour insérer un bloc…',h1:'Titre 1',h2:'Titre 2',ul:'Élément de liste',ol:'Élément de liste'};
function curNote(){var r=find(cur);return r&&r.n}
function renderBlocks(fid){
 var n=curNote(),h='',c=0;if(!n)return;
 n.blocks.forEach(function(b){
  c=b.t==='ol'?c+1:0;
  if(b.t==='page'){var r=find(b.ref);h+='<div class="blk" data-i="'+b.id+'" data-t="page">'+GUT+'<div class="pg" data-go="'+b.ref+'">'+(r?TPL[r.n.tpl].icon+' <b>'+esc(r.n.title||'Sans titre')+'</b>':'Page supprimée')+'</div></div>';return}
  h+='<div class="blk" data-i="'+b.id+'" data-t="'+b.t+'">'+GUT+'<span class="mk">'+(b.t==='ul'?'•':b.t==='ol'?c+'.':'')+'</span><div class="ce" contenteditable="true" data-ph="'+PH[b.t]+'">'+b.html+'</div></div>';
 });
 $('blocks').innerHTML=h;if(fid)focusB(fid);
}
function focusB(id){var el=document.querySelector('.blk[data-i="'+id+'"] .ce');if(!el)return;el.focus();var r=document.createRange();r.selectNodeContents(el);r.collapse(false);var s=getSelection();s.removeAllRanges();s.addRange(r)}
function showNote(){
 var r=find(cur),has=!!r;
 $('page').style.display=has?'':'none';$('empty').style.display=has?'none':'';
 $('expN').style.visibility=$('delN').style.visibility=has?'visible':'hidden';
 if(!has){$('crumb').textContent='';return}
 var chain=[],p=r.n;while(p.parent){var q=find(p.parent);if(!q)break;p=q.n;chain.unshift(p)}
 $('crumb').innerHTML=esc(r.f.name)+' › '+esc(r.s.name)+chain.map(function(x){return ' › <a data-n="'+x.id+'">'+esc(x.title||'Sans titre')+'</a>'}).join('');
 var T=TPL[r.n.tpl];$('badge').textContent=T.icon+' '+T.name;$('title').value=r.n.title;
 $('props').style.display=T.props.length?'':'none';
 $('props').innerHTML=T.props.map(function(p){var v=r.n.props[p.k]||'';
  return '<div class="pr"><label>'+p.l+'</label>'+(p.opts?'<select data-k="'+p.k+'">'+p.opts.map(function(o){return '<option'+(v===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select>':'<input data-k="'+p.k+'" value="'+esc(v)+'" placeholder="Vide">')+'</div>'}).join('');
 renderBlocks();
}
$('crumb').addEventListener('click',function(e){var a=e.target.closest('[data-n]');if(a)go(a.dataset.n)});
function go(id){cur=id;if($('q').value.trim())renderSearch();else renderTree();showNote()}
$('title').addEventListener('input',function(){var n=curNote();if(!n)return;n.title=this.value;save();var el=document.querySelector('.row.sel .name');if(el)el.textContent=this.value||'Sans titre'});
$('props').addEventListener('input',function(e){var n=curNote(),k=e.target.dataset.k;if(n&&k){n.props[k]=e.target.value;save()}});
$('props').addEventListener('change',function(e){var n=curNote(),k=e.target.dataset.k;if(n&&k){n.props[k]=e.target.value;save()}});

var bl=$('blocks');
function blockOf(el){var n=curNote(),id=el.closest('.blk').dataset.i;return{n:n,id:id,i:n.blocks.findIndex(function(b){return b.id===id})}}
function insertAfter(i,t,html,ref){var b={id:uid(),t:t,html:html||'',ref:ref};curNote().blocks.splice(i+1,0,b);save();return b}
bl.addEventListener('input',function(e){
 var ce=e.target.closest('.ce');if(!ce)return;var o=blockOf(ce),b=o.n.blocks[o.i],t=ce.textContent.replace(/\u00a0/g,' ');
 if(b.t==='text'){
  var m={'# ':'h1','## ':'h2','- ':'ul','* ':'ul','1. ':'ol'}[t];
  if(m){b.t=m;b.html='';save();renderBlocks(b.id);return}
  if(t==='/'){ce.innerHTML='';b.html='';openMenu(ce,typeItems(function(ty){convert(b.id,ty)}))}
 }
 b.html=ce.innerHTML;save();
});
bl.addEventListener('keydown',function(e){
 var ce=e.target.closest('.ce');if(!ce)return;var o=blockOf(ce),b=o.n.blocks[o.i];
 var empty=!ce.textContent.trim()&&!ce.querySelector('img');
 if(e.key==='Enter'&&!e.shiftKey){
  e.preventDefault();b.html=ce.innerHTML;
  if(empty&&b.t!=='text'){b.t='text';b.html='';save();renderBlocks(b.id);return}
  var nb=insertAfter(o.i,(b.t==='ul'||b.t==='ol')?b.t:'text');renderBlocks(nb.id);
 }else if(e.key==='Backspace'&&empty){
  if(b.t!=='text'){e.preventDefault();b.t='text';save();renderBlocks(b.id)}
  else if(o.n.blocks.length>1){e.preventDefault();var pv=o.n.blocks[o.i-1]||o.n.blocks[o.i+1];o.n.blocks.splice(o.i,1);save();renderBlocks(pv.id)}
 }else if(e.key==='ArrowUp'||e.key==='ArrowDown'){
  var sib=e.key==='ArrowUp'?ce.parentNode.previousElementSibling:ce.parentNode.nextElementSibling;
  var sel=getSelection();if(sib&&sel.isCollapsed&&sib.querySelector('.ce')){
   var r=sel.getRangeAt(0),a=r.getBoundingClientRect(),c=ce.getBoundingClientRect();
   if(a.height&&(e.key==='ArrowUp'?a.top-c.top<6:c.bottom-a.bottom<6)){e.preventDefault();sib.querySelector('.ce').focus()}}
 }
});
bl.addEventListener('paste',function(e){
 var ce=e.target.closest('.ce');if(!ce)return;var cd=e.clipboardData||{},items=cd.items||[];
 for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image/')===0){
  e.preventDefault();var fr=new FileReader();
  fr.onload=function(){document.execCommand('insertImage',false,fr.result);ce.dispatchEvent(new Event('input',{bubbles:true}))};
  fr.readAsDataURL(items[i].getAsFile());return}}
 e.preventDefault();var t=(cd.getData('text/plain')||''),lines=t.split(/\r?\n/).filter(function(l){return l.trim()});
 if(lines.length>1){var o=blockOf(ce),b=o.n.blocks[o.i],ty=(b.t==='ul'||b.t==='ol')?b.t:'text',at=o.i,last;
  document.execCommand('insertText',false,lines[0]);b.html=ce.innerHTML;
  lines.slice(1).forEach(function(l){last=insertAfter(at++,ty,esc(l))});renderBlocks(last.id)}
 else document.execCommand('insertText',false,t);
});
bl.addEventListener('click',function(e){
 var g=e.target.closest('[data-g]'),pg=e.target.closest('[data-go]');
 if(pg){go(pg.dataset.go);return}
 if(!g)return;var o=blockOf(g),b=o.n.blocks[o.i];
 if(g.dataset.g==='add')openMenu(g,typeItems(function(t){addBlock(o.i,t)}));
 else{var it=typeItems(function(t){convert(b.id,t)},true).map(function(x){return['Convertir en '+x[0],x[1]]});
  it.push(['↑ Monter',function(){mv(o.i,-1)}],['↓ Descendre',function(){mv(o.i,1)}],['🗑 Supprimer',function(){delBlock(b.id)}]);openMenu(g,it)}
});
$('addB').onclick=function(){var n=curNote();if(n)openMenu($('addB'),typeItems(function(t){addBlock(n.blocks.length-1,t)}))};
function typeItems(fn,noPage){return TYPES.filter(function(t){return!(noPage&&t[0]==='page')}).map(function(t){return[t[2]+'  '+t[1],function(){fn(t[0])}]})}
function addBlock(i,t){
 if(t==='page'){var r=find(cur);newNoteD(r.s,cur,function(ch){var b=insertAfter(i,'page','',ch.id);renderTree();renderBlocks()});return}
 var b=insertAfter(i,t);renderBlocks(b.id)}
function convert(id,t){var n=curNote(),b=n.blocks.filter(function(x){return x.id===id})[0];
 if(t==='page'){var r=find(cur);newNoteD(r.s,cur,function(ch){b.t='page';b.ref=ch.id;b.html='';save();renderTree();renderBlocks()});return}
 b.t=t;save();renderBlocks(id)}
function mv(i,d){var a=curNote().blocks,j=i+d;if(j<0||j>=a.length)return;var x=a[i];a[i]=a[j];a[j]=x;save();renderBlocks()}
function delBlock(id){var n=curNote(),b=n.blocks.filter(function(x){return x.id===id})[0];
 if(b.t==='page')dropNotes([b.ref]);
 n.blocks=n.blocks.filter(function(x){return x.id!==id});if(!n.blocks.length)n.blocks.push({id:uid(),t:'text',html:''});save();renderTree();renderBlocks()}

/* ---------- menu & dialogues ---------- */
var menu=$('menu');
function openMenu(anchor,items){
 menu.innerHTML=items.map(function(x,i){return '<button data-m="'+i+'">'+x[0]+'</button>'}).join('');menu._i=items;
 var r=anchor.getBoundingClientRect();menu.style.display='block';
 menu.style.left=Math.max(6,Math.min(r.left,innerWidth-230))+'px';
 menu.style.top=Math.max(6,Math.min(r.bottom+4,innerHeight-menu.offsetHeight-8))+'px';
}
menu.addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;menu.style.display='none';menu._i[b.dataset.m][1]()});
document.addEventListener('mousedown',function(e){if(!menu.contains(e.target))menu.style.display='none'});
document.addEventListener('keydown',function(e){if(e.key==='Escape')menu.style.display='none'});
function closeD(){$('ov').classList.remove('on');$('dlg').innerHTML=''}
$('ov').addEventListener('mousedown',function(e){if(e.target===this)closeD()});
function ask(title,val){return new Promise(function(res){
 $('dlg').innerHTML='<h3>'+esc(title)+'</h3><input type="text" id="dv"><div class="acts"><button class="btn" id="dc">Annuler</button><button class="btn pri" id="dk">OK</button></div>';
 $('ov').classList.add('on');var i=$('dv');i.value=val||'';i.focus();i.select();
 function ok(){var v=i.value.trim();closeD();res(v)}
 $('dk').onclick=ok;$('dc').onclick=function(){closeD();res(null)};
 i.onkeydown=function(e){if(e.key==='Enter')ok();if(e.key==='Escape'){closeD();res(null)}};
})}
function confirmD(msg){return new Promise(function(res){
 $('dlg').innerHTML='<h3>Confirmation</h3><p>'+esc(msg)+'</p><div class="acts"><button class="btn" id="dc">Annuler</button><button class="btn pri" id="dk">Supprimer</button></div>';
 $('ov').classList.add('on');$('dk').onclick=function(){closeD();res(true)};$('dc').onclick=function(){closeD();res(false)};
})}
function newNoteD(sec,parent,cb){
 $('dlg').innerHTML='<h3>'+(parent?'Nouvelle page':'Nouvelle note')+'</h3><input type="text" id="dv" placeholder="Titre (facultatif)"><div class="hint">Choisissez un modèle :</div><div class="tpls">'+Object.keys(TPL).map(function(k){return '<button class="tpl" data-t="'+k+'">'+TPL[k].icon+' <b>'+TPL[k].name+'</b><small>'+TPL[k].desc+'</small></button>'}).join('')+'</div><div class="acts"><button class="btn" id="dc">Annuler</button></div>';
 $('ov').classList.add('on');$('dv').focus();
 $('dc').onclick=closeD;
 $('dlg').querySelector('.tpls').onclick=function(e){var b=e.target.closest('[data-t]');if(!b)return;
  var t=b.dataset.t,n=mk(t,$('dv').value.trim()||TPL[t].name,parent);sec.notes.push(n);save();closeD();cb(n)};
}

/* ---------- conversion / export ---------- */
function conv(node,fmt){var o='';node.childNodes.forEach(function(n){o+=cn(n,fmt)});return o}
function cn(n,fmt){
 if(n.nodeType===3)return n.nodeValue;if(n.nodeType!==1)return'';
 var t=n.tagName.toLowerCase(),md=fmt==='md',inner=function(){return conv(n,fmt)};
 if(/^h[1-6]$/.test(t))return '\n'+(md?'#'.repeat(+t[1])+' ':'')+inner().trim()+'\n\n';
 if(t==='p'||t==='div'||t==='section')return inner().trim()?inner().replace(/^\n+|\n+$/g,'')+'\n\n':'\n';
 if(t==='br')return'\n';
 if(t==='b'||t==='strong')return md?'**'+inner()+'**':inner();
 if(t==='i'||t==='em')return md?'*'+inner()+'*':inner();
 if(t==='a')return md?'['+inner()+']('+n.getAttribute('href')+')':inner();
 if(t==='img')return md?'![image]('+n.getAttribute('src')+')':'[image]';
 if(t==='ul'||t==='ol'){var i=0,s='';n.childNodes.forEach(function(li){if(li.tagName==='LI'){i++;s+=(t==='ul'?'- ':i+'. ')+conv(li,fmt).trim().replace(/\n+/g,'\n   ')+'\n'}});return s+'\n'}
 return inner();
}
function bodyHtml(n,lvl){
 var h='',op=null,T=TPL[n.tpl];
 var cl=function(){if(op){h+='</'+op+'>';op=null}};
 T.props.forEach(function(p){var v=(n.props||{})[p.k];if(v)h+='<p><b>'+p.l+' :</b> '+esc(v)+'</p>'});
 n.blocks.forEach(function(b){
  if(b.t==='ul'||b.t==='ol'){if(op!==b.t){cl();h+='<'+b.t+'>';op=b.t}h+='<li>'+b.html+'</li>';return}
  cl();
  if(b.t==='text'){if(b.html.replace(/<br>/g,'').trim())h+='<p>'+b.html+'</p>'}
  else if(b.t==='h1'||b.t==='h2'){var k=Math.min(6,lvl+(b.t==='h1'?1:2));h+='<h'+k+'>'+b.html+'</h'+k+'>'}
  else if(b.t==='page'){var r=find(b.ref);if(r){var k2=Math.min(6,lvl+1);h+='<h'+k2+'>'+esc(r.n.title)+'</h'+k2+'>'+bodyHtml(r.n,lvl+1)}}
 });cl();return h;
}
function noteOut(n,fmt,lvl){
 var ttl=n.title||'Sans titre',b=bodyHtml(n,lvl);
 if(fmt==='html')return '<h'+lvl+'>'+esc(ttl)+'</h'+lvl+'>\n'+b+'\n';
 var d=document.createElement('div');d.innerHTML=b;
 return (fmt==='md'?'#'.repeat(lvl)+' '+ttl:ttl.toUpperCase()+'\n'+'='.repeat(ttl.length))+'\n\n'+conv(d,fmt).replace(/\n{3,}/g,'\n\n').trim()+'\n';
}
function head(fmt,name,lvl){return fmt==='html'?'<h'+lvl+'>'+esc(name)+'</h'+lvl+'>\n':fmt==='md'?'#'.repeat(lvl)+' '+name+'\n\n':name.toUpperCase()+'\n'+'-'.repeat(name.length)+'\n\n'}
function tops(s){return s.notes.filter(function(n){return!n.parent})}
function build(kind,id,fmt){
 var o='';
 if(kind==='n')o=noteOut(find(id).n,fmt,1);
 else if(kind==='s'){var s=findS(id);o=head(fmt,s.name,1)+tops(s).map(function(n){return noteOut(n,fmt,2)}).join('\n')}
 else{var f=findF(id);o=head(fmt,f.name,1)+f.sections.map(function(s){return head(fmt,s.name,2)+tops(s).map(function(n){return noteOut(n,fmt,3)}).join('\n')}).join('\n')}
 if(fmt==='html')o='<!DOCTYPE html>\n<html lang="fr"><head><meta charset="utf-8"><title>Export</title></head>\n<body>\n'+o+'</body></html>';
 return o;
}
function exportD(kind,id){
 var fmt='md',lbl={n:'la note',s:'la sélection',f:'le dossier'}[kind];
 $('dlg').innerHTML='<h3>Exporter '+lbl+'</h3><div class="tabs"><button class="btn on" data-f="md">Markdown</button><button class="btn" data-f="html">HTML</button><button class="btn" data-f="txt">Texte</button></div><textarea id="out" readonly></textarea><div class="hint">Copiez le résultat puis collez-le dans un fichier (.md, .html ou .txt). Le téléchargement direct sera disponible dans la version finale.</div><div class="acts"><button class="btn" id="dc">Fermer</button><button class="btn pri" id="cp">Copier</button></div>';
 $('ov').classList.add('on');
 function fill(){$('out').value=build(kind,id,fmt)}fill();
 $('dlg').querySelector('.tabs').onclick=function(e){var b=e.target.closest('[data-f]');if(!b)return;fmt=b.dataset.f;this.querySelectorAll('.btn').forEach(function(x){x.classList.toggle('on',x===b)});fill()};
 $('dc').onclick=closeD;
 $('cp').onclick=function(){var t=$('out');t.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}$('cp').textContent=ok?'Copié ✓':'Sélectionné (Ctrl+C)'};
}

/* ---------- actions ---------- */
function dropNotes(ids){
 var all=[];ids.forEach(function(i){all.push(i)});
 var ch=true;while(ch){ch=false;S.folders.forEach(function(f){f.sections.forEach(function(s){s.notes.forEach(function(n){if(n.parent&&all.indexOf(n.parent)>=0&&all.indexOf(n.id)<0){all.push(n.id);ch=true}})})})}
 S.folders.forEach(function(f){f.sections.forEach(function(s){
  s.notes=s.notes.filter(function(n){return all.indexOf(n.id)<0});
  s.notes.forEach(function(n){n.blocks=n.blocks.filter(function(b){return!(b.t==='page'&&all.indexOf(b.ref)>=0)});if(!n.blocks.length)n.blocks.push({id:uid(),t:'text',html:''})})})});
 if(cur&&!find(cur))cur=null;save();
}
function act(a,k,id){
 if(a==='ren'){var o=k==='n'?find(id).n:k==='s'?findS(id):findF(id),nm=k==='n'?'title':'name';
  ask('Nouveau nom',o[nm]).then(function(v){if(!v)return;o[nm]=v;save();renderTree();showNote()})}
 else if(a==='exp')exportD(k,id);
 else if(a==='del'){confirmD('Supprimer cet élément et tout ce qu’il contient ?').then(function(y){if(!y)return;
  if(k==='n')dropNotes([id]);
  else if(k==='s'){var ids=[];S.folders.forEach(function(f){f.sections.forEach(function(s){if(s.id===id)ids=s.notes.map(function(n){return n.id})})});S.folders.forEach(function(f){f.sections=f.sections.filter(function(s){return s.id!==id})});if(cur&&!find(cur))cur=null;save()}
  else{S.folders=S.folders.filter(function(f){return f.id!==id});if(cur&&!find(cur))cur=null;save()}
  renderTree();showNote()})}
}
$('addF').onclick=function(){ask('Nom du nouveau dossier','').then(function(v){if(!v)return;S.folders.push({id:uid(),name:v,sections:[]});save();renderTree()})};
$('expN').onclick=function(){if(cur)exportD('n',cur)};
$('delN').onclick=function(){if(cur)act('del','n',cur)};
$('tree').addEventListener('click',function(e){
 var ib=e.target.closest('.ib');
 if(ib){e.stopPropagation();var a=ib.dataset.a;
  if(a==='addS'){var f=findF(ib.dataset.i);ask('Nom de la nouvelle sélection','').then(function(v){if(!v)return;f.sections.push({id:uid(),name:v,notes:[]});open[f.id]=true;save();renderTree()})}
  else if(a==='addN'){var s=findS(ib.dataset.i);newNoteD(s,null,function(n){open[s.id]=true;go(n.id);$('title').focus();$('title').select()})}
  else act(a,ib.dataset.k,ib.dataset.i);return}
 var r=e.target.closest('[data-a]');if(!r)return;
 if(r.dataset.a==='tog'){open[r.dataset.i]=open[r.dataset.i]===false;renderTree()}
 else if(r.dataset.a==='note')go(r.dataset.i);
});

var f0=S.folders[0]&&S.folders[0].sections[0]&&S.folders[0].sections[0].notes[0];
cur=f0?f0.id:null;renderTree();showNote();
})();
</script>
